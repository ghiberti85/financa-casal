<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af7"/>
      <stop offset="100%" style="stop-color:#5040cc"/>
    </linearGradient>
    <!-- Crown facets -->
    <linearGradient id="fl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d0cbff;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="fr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8b0ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#9080ee;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="ft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e4ff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <!-- Pavilion facets -->
    <linearGradient id="pl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0cbff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#a090ee;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="pr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9888dd;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#7060c0;stop-opacity:0.75"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Diamond — 5 visible facets -->
  <!-- Key points:
       Table-left  (A): 25, 12   Table-right (B): 39, 12
       Girdle-left (E): 8,  34   Girdle-right(C): 56, 34
       Culet       (D): 32, 56   Table-center(F): 32, 12
       Girdle-mid  (M): 32, 34
  -->

  <!-- Crown-left facet: A-F-M-E -->
  <polygon points="25,12 32,12 32,34 8,34" fill="url(#fl)"/>

  <!-- Crown-right facet: F-B-C-M -->
  <polygon points="32,12 39,12 56,34 32,34" fill="url(#fr)"/>

  <!-- Table (top face): A-B-F — brightest strip -->
  <rect x="25" y="10" width="14" height="4" rx="1" fill="url(#ft)" opacity="0.95"/>

  <!-- Pavilion-left facet: E-M-D -->
  <polygon points="8,34 32,34 32,56" fill="url(#pl)"/>

  <!-- Pavilion-right facet: M-C-D -->
  <polygon points="32,34 56,34 32,56" fill="url(#pr)"/>

  <!-- Facet edge lines (subtle, white) -->
  <line x1="32" y1="12" x2="32" y2="56" stroke="white" stroke-width="0.6" opacity="0.25"/>
  <line x1="8"  y1="34" x2="56" y2="34" stroke="white" stroke-width="0.6" opacity="0.25"/>
  <line x1="25" y1="12" x2="8"  y2="34" stroke="white" stroke-width="0.4" opacity="0.2"/>
  <line x1="39" y1="12" x2="56" y2="34" stroke="white" stroke-width="0.4" opacity="0.2"/>

  <!-- Sparkle (top-right corner) -->
  <g transform="translate(50,10)" opacity="0.9">
    <line x1="0" y1="-5" x2="0" y2="5"  stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0"  stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="white" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="white" stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>
